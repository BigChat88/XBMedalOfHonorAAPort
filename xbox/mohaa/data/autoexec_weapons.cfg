// Test ISO: straight into the training map; BACK gives every weapon once
// (make iso AUTOEXEC=data/autoexec_weapons.cfg)
set developer 0
set cl_playintro 0
set xbox_memtrace 1
// no "continue" button after loading (cl_ui.cpp)
set xbox_autocontinue 1
// MOHAA only allows cheat commands with thereisnomonkey set (fgame/entity.cpp)
set thereisnomonkey 1
// BACK: give all, then back to its normal binding (so the saved config stays clean)
bind PAD0_BACK "give all; bind PAD0_BACK +scores"
// autoexec runs before the server commands exist: let init finish first
wait 5
// spdevmap: single player map with cheats on
spdevmap training

// Test ISO: opens the Advanced options menu during a game on the map with the
// least free memory (make iso AUTOEXEC=data/autoexec_advanced.cfg)
set developer 0
set cl_playintro 0
set xbox_autocontinue 1
set xbox_perf 1
wait 5
spmap m4l3
wait 30000
echo STEP game
pushmenu options_main
wait 8000
echo STEP options
pushmenu advancedoptions
wait 8000
echo STEP advanced
popmenu 0
wait 3000
pushmenu audio_options
wait 8000
echo STEP audio
popmenu 0
wait 3000
pushmenu advancedoptions
wait 8000
echo STEP done

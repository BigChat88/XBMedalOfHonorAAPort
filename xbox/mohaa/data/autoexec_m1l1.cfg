// Test ISO: first level, with script prints in the serial log
// (make iso AUTOEXEC=data/autoexec_m1l1.cfg)
set developer 1
set cl_playintro 0
// no "continue" button after loading (cl_ui.cpp)
set xbox_autocontinue 1
// autoexec runs before the server commands exist: let init finish first
wait 5
spmap m1l1

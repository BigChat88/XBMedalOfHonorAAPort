// Test ISO: load the heaviest map directly to measure memory
// (make iso AUTOEXEC=data/autoexec_m4l3.cfg)
set developer 1
set cl_playintro 0
set xbox_memtrace 1
// no "continue" button after loading (cl_ui.cpp)
set xbox_autocontinue 1
// autoexec runs before the server commands exist: let init finish first
wait 5
spmap m4l3

// Xbox defaults (OGX MOHAA).
//
// Executed right after default.cfg, so the saved config (and the menus) can
// still change any of these. The controller bindings are not here: after the
// saved config runs, Xbox_ApplyPadDefaults (xbox_uipad.cpp) binds every
// controller button that has no binding, so an old config's "unbindall"
// cannot leave the pad dead.

// Sound: the WAVs stay in memory as PCM; 44 kHz ones are downsampled to
// 22 kHz on load (38% of the game's sound data is 44 kHz).
set s_khz 22

// Controller analog sticks (in_joystick / in_joystickUseAnalog are forced on).
// Dead zones and response curves are in sdl_input.c, the turn boost in
// cl_input.cpp; joy_threshold only applies to the triggers.
// look: degrees per second at full deflection = 32767 * value
// (~150 horizontal, ~105 vertical, before the turn boost)
set j_yaw -0.0046
set j_pitch 0.0032
// move: full deflection = 127, the usercmd maximum
set j_forward -0.0039
set j_side 0.0039
set cl_run 1

// Characters lit from the light grid instead of per vertex (much cheaper)
set r_fastentlight 1

// Detail: the original game's "high" profile (high.cfg); OpenMoHAA's defaults
// are above it and cost CPU that the Xbox doesn't have
set r_lodscale 0.55
set r_lodcap 0.55
set r_subdivisions 4
set ter_error 9
set ter_maxlod 4
set cg_effectdetail 0.8

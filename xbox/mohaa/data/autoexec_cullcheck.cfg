// Test ISO: a map on foot, turning around by itself, with the PERF lines on,
// to check the skeletal model cull (make iso AUTOEXEC=data/autoexec_cullcheck.cfg)
set developer 1
set cl_playintro 0
// no "continue" button after loading (cl_ui.cpp)
set xbox_autocontinue 1
set xbox_perf 1
// autoexec runs before the server commands exist: let init finish first
wait 5
spmap m1l2a
wait 15000
+right
wait 40000
-right
+left
wait 20000
-left
+lookup
wait 300
-lookup
+right
wait 20000
-right

// Test ISO: m1l2a (same sky as m1l1, player on foot): looks up and turns around
// by itself, to look at the sky from every side (make iso AUTOEXEC=data/autoexec_sky.cfg)
set developer 1
set cl_playintro 0
// no "continue" button after loading (cl_ui.cpp)
set xbox_autocontinue 1
set cl_yawspeed 30
// autoexec runs before the server commands exist: let init finish first
wait 5
spmap m1l2a
wait 15000
+lookup
wait 350
-lookup
+right

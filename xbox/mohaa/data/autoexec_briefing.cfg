// Test ISO: new game from the first briefing (briefing -> m1l1 transition)
// (make iso AUTOEXEC=data/autoexec_briefing.cfg)
set developer 1
set cl_playintro 0
set xbox_memtrace 1
// no "continue" button after loading (cl_ui.cpp)
set xbox_autocontinue 1
// autoexec runs before the server commands exist: let init finish first
wait 5
spmap briefing/briefing1

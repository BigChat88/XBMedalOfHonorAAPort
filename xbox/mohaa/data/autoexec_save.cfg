// Test ISO: m1l2a (same sky as m1l1, player on foot): looks up by itself, saves
// and loads that save back, to look at the sky, the save's stall and the file,
// without any input (make iso AUTOEXEC=data/autoexec_save.cfg)
set developer 1
set cl_playintro 0
// no "continue" button after loading (cl_ui.cpp)
set xbox_autocontinue 1
// autoexec runs before the server commands exist: let init finish first
wait 5
spmap m1l2a
wait 20000
+lookup
wait 450
-lookup
wait 8000
savegame savetest
wait 8000
loadgame savetest

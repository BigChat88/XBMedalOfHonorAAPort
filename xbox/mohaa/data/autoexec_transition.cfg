// Test ISO: level change (m1l1 -> m1l2a): freeing the previous level's images
// at the start of the load, and the modules' reload
// (make iso AUTOEXEC=data/autoexec_transition.cfg)
set developer 1
set cl_playintro 0
set xbox_memtrace 1
// no "continue" button after loading (cl_ui.cpp)
set xbox_autocontinue 1
// autoexec runs before the server commands exist: let init finish first
wait 5
spmap m1l1
wait 1500
spmap m1l2a

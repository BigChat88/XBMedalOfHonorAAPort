// Test ISO: performance measurement (xbox_perf.c prints a PERF line every 2 s)
// (make iso AUTOEXEC=data/autoexec_perf.cfg)
set cl_playintro 0
set xbox_memtrace 1
// no "continue" button after loading (cl_ui.cpp)
set xbox_autocontinue 1
// 2: also on screen, to read it on a console
set xbox_perf 2
// autoexec runs before the server commands exist: let init finish first
wait 5
spmap m1l1
